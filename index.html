// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  // Accepts either setTweak('key', value) or setTweak({ key: value, ... }) so a
  // useState-style call doesn't write a "[object Object]" key into the persisted
  // JSON block.
  const setTweak = React.useCallback((keyOrEdits, val) => {
    const edits = typeof keyOrEdits === 'object' && keyOrEdits !== null
      ? keyOrEdits : { [keyOrEdits]: val };
    setValues((prev) => ({ ...prev, ...edits }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits }, '*');
    // Same-window signal so in-page listeners (deck-stage rail thumbnails)
    // can react — the parent message only reaches the host, not peers.
    window.dispatchEvent(new CustomEvent('tweakchange', { detail: edits }));
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel" data-omelette-chrome=""
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">
          {children}
        </div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  // Segments wrap mid-word once per-segment width runs out. The track is
  // ~248px (280 panel − 28 body pad − 4 seg pad), each button loses 12px
  // to its own padding, and 11.5px system-ui averages ~6.3px/char — so 2
  // options fit ~16 chars each, 3 fit ~10. Past that (or >3 options), fall
  // back to a dropdown rather than wrap.
  const labelLen = (o) => String(typeof o === 'object' ? o.label : o).length;
  const maxLen = options.reduce((m, o) => Math.max(m, labelLen(o)), 0);
  const fitsAsSegments = maxLen <= ({ 2: 16, 3: 10 }[options.length] ?? 0);
  if (!fitsAsSegments) {
    // <select> emits strings — map back to the original option value so the
    // fallback stays type-preserving (numbers, booleans) like the segment path.
    const resolve = (s) => {
      const m = options.find((o) => String(typeof o === 'object' ? o.value : o) === s);
      return m === undefined ? s : typeof m === 'object' ? m.value : m;
    };
    return <TweakSelect label={label} value={value} options={options}
                        onChange={(s) => onChange(resolve(s))} />;
  }
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

// Relative-luminance contrast pick — checkmarks drawn over a swatch need to
// read on both #111 and #fafafa without per-option configuration. Hex input
// only (#rgb / #rrggbb); named or rgb()/hsl() colors fall through to "light".
function __twkIsLight(hex) {
  const h = String(hex).replace('#', '');
  const x = h.length === 3 ? h.replace(/./g, (c) => c + c) : h.padEnd(6, '0');
  const n = parseInt(x.slice(0, 6), 16);
  if (Number.isNaN(n)) return true;
  const r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return r * 299 + g * 587 + b * 114 > 148000;
}

const __TwkCheck = ({ light }) => (
  <svg viewBox="0 0 14 14" aria-hidden="true">
    <path d="M3 7.2 5.8 10 11 4.2" fill="none" strokeWidth="2.2"
          strokeLinecap="round" strokeLinejoin="round"
          stroke={light ? 'rgba(0,0,0,.78)' : '#fff'} />
  </svg>
);

// TweakColor — curated color/palette picker. Each option is either a single
// hex string or an array of 1-5 hex strings; the card adapts — a lone color
// renders solid, a palette renders colors[0] as the hero (left ~2/3) with the
// rest stacked in a sharp column on the right. onChange emits the
// option in the shape it was passed (string stays string, array stays array).
// Without options it falls back to the native color input for back-compat.
function TweakColor({ label, value, options, onChange }) {
  if (!options || !options.length) {
    return (
      <div className="twk-row twk-row-h">
        <div className="twk-lbl"><span>{label}</span></div>
        <input type="color" className="twk-swatch" value={value}
               onChange={(e) => onChange(e.target.value)} />
      </div>
    );
  }
  // Native <input type=color> emits lowercase hex per the HTML spec, so
  // compare case-insensitively. String() guards JSON.stringify(undefined),
  // which returns the primitive undefined (no .toLowerCase).
  const key = (o) => String(JSON.stringify(o)).toLowerCase();
  const cur = key(value);
  return (
    <TweakRow label={label}>
      <div className="twk-chips" role="radiogroup">
        {options.map((o, i) => {
          const colors = Array.isArray(o) ? o : [o];
          const [hero, ...rest] = colors;
          const sup = rest.slice(0, 4);
          const on = key(o) === cur;
          return (
            <button key={i} type="button" className="twk-chip" role="radio"
                    aria-checked={on} data-on={on ? '1' : '0'}
                    aria-label={colors.join(', ')} title={colors.join(' · ')}
                    style={{ background: hero }}
                    onClick={() => onChange(o)}>
              {sup.length > 0 && (
                <span>
                  {sup.map((c, j) => <i key={j} style={{ background: c }} />)}
                </span>
              )}
              {on && <__TwkCheck light={__twkIsLight(hero)} />}
            </button>
          );
        })}
      </div>
    </TweakRow>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

</script>

      {/* métricas */}
      <div style={{ display: 'flex', gap: 10, padding: '12px 26px 0', flexShrink: 0 }}>
        {[
          { v: String(hoy), l: 'Registros hoy' },
          { v: String(pendientes), l: 'En cola' },
          { v: '100%', l: 'GPS válido' },
        ].map((m) => (
          <div key={m.l} style={{
            flex: 1, padding: '13px 8px 12px', borderRadius: 12, textAlign: 'center',
            background: 'var(--di-panel)', border: '1px solid var(--di-border)',
          }}>
            <div style={{ fontFamily: DI_FONT_SANS, fontSize: 24, fontWeight: 700, color: 'var(--di-text)' }}>{m.v}</div>
            <div style={{ fontFamily: DI_FONT_MONO, fontSize: 9.5, letterSpacing: '0.12em', color: 'var(--di-muted)', textTransform: 'uppercase', marginTop: 4 }}>{m.l}</div>
          </div>
        ))}
      </div>

      {/* registros recientes */}
      <div style={{ padding: '20px 26px 0', flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{
          fontFamily: DI_FONT_MONO, fontSize: 10.5, letterSpacing: '0.22em', color: 'var(--di-muted)',
          textTransform: 'uppercase', marginBottom: 10, flexShrink: 0,
        }}>Registros recientes</div>
        <div style={{ overflow: 'auto', minHeight: 0, display: 'flex', flexDirection: 'column', gap: 8, paddingBottom: 6 }}>
          {[...records].reverse().map((r) => (
            <div key={r.id} style={{
              display: 'flex', alignItems: 'center', gap: 12, padding: '11px 14px',
              borderRadius: 11, background: 'var(--di-panel)', border: '1px solid var(--di-border)', flexShrink: 0,
            }}>
              <span style={{ color: 'var(--di-muted)', display: 'flex' }}><DIIcons.Doc /></span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontFamily: DI_FONT_SANS, fontSize: 14.5, fontWeight: 600, color: 'var(--di-text)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{r.nombre}</div>
                <div style={{ fontFamily: DI_FONT_MONO, fontSize: 10.5, letterSpacing: '0.06em', color: 'var(--di-muted)', marginTop: 2 }}>{r.id} · {r.mun} · {r.hora}</div>
              </div>
              <span style={{
                display: 'inline-flex', alignItems: 'center', gap: 6, fontFamily: DI_FONT_MONO,
                fontSize: 10, letterSpacing: '0.08em', color: estadoDot(r.estado), textTransform: 'uppercase',
              }}>
                {r.estado === 'syncing'
                  ? <DIIcons.Sync size={11} spinning />
                  : <span style={{ width: 6, height: 6, borderRadius: '50%', background: estadoDot(r.estado) }}></span>}
                <span>{r.estado === 'syncing' ? 'subiendo' : r.estado}</span>
              </span>
            </div>
          ))}
        </div>
      </div>

      <div style={{ padding: '10px 26px 18px', flexShrink: 0 }}>
        <DIBtn onClick={onNueva}><DIIcons.Plus /> <span>Nueva captura</span></DIBtn>
      </div>
    </div>
  );
}

// ── MÓDULO 02 · Captura OCR ───────────────────────────────────
const OCR_CHECKS = ['Píxeles', 'Luz', 'Ángulo'];
const OCR_LINES = [
  'Detectando documento…',
  'CC 1.098.765.432',
  'TORRES, MARÍA GABRIELA',
  'QUIBDÓ · CHOCÓ',
  'Confianza 98.2%',
];

function CaptureScreen({ anim, onBack, onDone }) {
  const [checks, setChecks] = useState(0);
  const [fase, setFase] = useState('aim'); // aim | proc
  const [lineas, setLineas] = useState(0);
  const timers = useRef([]);
  useEffect(() => () => timers.current.forEach(clearTimeout), []);

  useEffect(() => {
    OCR_CHECKS.forEach((_, i) =>
      timers.current.push(setTimeout(() => setChecks(i + 1), 800 + i * 700)));
  }, []);

  const listo = checks >= OCR_CHECKS.length;

  const capturar = () => {
    if (!listo || fase !== 'aim') return;
    setFase('proc');
    OCR_LINES.forEach((_, i) =>
      timers.current.push(setTimeout(() => setLineas(i + 1), 350 + i * 480)));
    timers.current.push(setTimeout(() => onDone(), 350 + OCR_LINES.length * 480 + 650));
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <DIModuleTag n="Módulo 02" title="Captura del acta" onBack={onBack} />

      {/* visor */}
      <div style={{ padding: '18px 26px 0', flex: 1, minHeight: 0, display: 'flex', flexDirection: 'column' }}>
        <div style={{
          flex: 1, minHeight: 0, borderRadius: 16, position: 'relative', overflow: 'hidden',
          background: 'linear-gradient(160deg, #0c1514 0%, #080f0e 60%, #0a1211 100%)',
          border: '1px solid var(--di-border)',
        }}>
          {/* esquinas */}
          {[
            { top: 18, left: 18, bt: 1, bl: 1 }, { top: 18, right: 18, bt: 1, br: 1 },
            { bottom: 18, left: 18, bb: 1, bl: 1 }, { bottom: 18, right: 18, bb: 1, br: 1 },
          ].map((c, i) => (
            <div key={i} style={{
              position: 'absolute', width: 34, height: 34,
              top: c.top, left: c.left, right: c.right, bottom: c.bottom,
              borderTop: c.bt ? '2.5px solid var(--di-acc)' : 'none',
              borderBottom: c.bb ? '2.5px solid var(--di-acc)' : 'none',
              borderLeft: c.bl ? '2.5px solid var(--di-acc)' : 'none',
              borderRight: c.br ? '2.5px solid var(--di-acc)' : 'none',
              borderRadius: 3, opacity: 0.95,
            }}></div>
          ))}

          {/* línea de escaneo */}
          {anim && fase === 'aim' && (
            <div style={{
              position: 'absolute', left: 30, right: 30, top: 0, height: 2, borderRadius: 2,
              background: 'var(--di-acc)', opacity: 0.65, boxShadow: '0 0 18px var(--di-acc)',
              animation: 'di-viewscan 2.8s ease-in-out infinite',
            }}></div>
          )}

          {fase === 'aim' && (
            <div style={{
              position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center',
              fontFamily: DI_FONT_MONO, fontSize: 13, letterSpacing: '0.12em', color: 'var(--di-muted)',
            }}>{listo ? 'Documento alineado' : 'Apunta al documento'}</div>
          )}

          {/* salida OCR */}
          {fase === 'proc' && (
            <div style={{ position: 'absolute', inset: 0, padding: '34px 30px', display: 'flex', flexDirection: 'column', gap: 13, justifyContent: 'center' }}>
              {OCR_LINES.slice(0, lineas).map((l, i) => (
                <div key={l} style={{
                  fontFamily: DI_FONT_MONO, fontSize: i === 0 ? 11.5 : 13.5, letterSpacing: '0.08em',
                  color: i === 0 ? 'var(--di-muted)' : 'var(--di-acc)',
                  animation: 'di-rise .3s ease-out', display: 'flex', alignItems: 'center', gap: 9,
                }}>
                  {i > 0 && <DIIcons.Check size={11} />}
                  <span>{l}</span>
                </div>
              ))}
              {lineas >= OCR_LINES.length && (
                <div style={{ fontFamily: DI_FONT_MONO, fontSize: 11.5, letterSpacing: '0.1em', color: 'var(--di-muted)', animation: 'di-rise .3s ease-out', marginTop: 6 }}>
                  → Enviando al formulario…
                </div>
              )}
            </div>
          )}
        </div>

        {/* chip motor + checks */}
        <div style={{ paddingTop: 14, display: 'flex', flexDirection: 'column', gap: 10, flexShrink: 0 }}>
          <DIChip tone="solid" style={{ alignSelf: 'stretch', justifyContent: 'center', padding: '9px 12px' }}>
            <span style={{ color: 'var(--di-acc)' }}>◉</span>
            <span>ML Kit · OCR en tiempo real · 100% offline</span>
          </DIChip>
          <div style={{ display: 'flex', gap: 8, justifyContent: 'center' }}>
            {OCR_CHECKS.map((c, i) => (
              <DIChip key={c} tone={i < checks ? 'acc' : 'neutral'} style={{ transition: 'all .3s' }}>
                {i < checks ? <DIIcons.Check size={10} /> : <span style={{ width: 6, height: 6, borderRadius: '50%', background: 'var(--di-border2)', display: 'inline-block' }}></span>}
                <span>{c}</span>
              </DIChip>
            ))}
          </div>
        </div>
      </div>

      {/* obturador */}
      <div style={{ padding: '14px 0 16px', display: 'flex', justifyContent: 'center', flexShrink: 0 }}>
        <button onClick={capturar} aria-label="Capturar" className={listo && fase === 'aim' ? 'di-press' : ''} style={{
          width: 72, height: 72, borderRadius: '50%', cursor: listo && fase === 'aim' ? 'pointer' : 'default',
          background: 'var(--di-text)', border: '4px solid var(--di-bg)',
          boxShadow: listo && fase === 'aim' ? '0 0 0 2px var(--di-acc), 0 8px 24px rgba(0,0,0,0.45)' : '0 0 0 2px var(--di-border2)',
          display: 'flex', alignItems: 'center', justifyContent: 'center', color: '#0a1110',
          opacity: fase === 'proc' ? 0.35 : 1, transition: 'all .3s',
        }}>
          <DIIcons.Camera />
        </button>
      </div>
    </div>
  );
}

Object.assign(window, { AuthScreen, HomeScreen, CaptureScreen });

</script>

<script type="text/babel" data-presets="react">
// DocIntel — pantallas: formulario del beneficiario + confirmación
// Exporta a window: FormScreen, SuccessScreen

const { useState: useStateF, useEffect: useEffectF, useRef: useRefF } = React;

// ── MÓDULO 03 · Datos del beneficiario ────────────────────────
function FormScreen({ onBack, onSaved }) {
  const [cedula, setCedula] = useStateF('1.098.765.432');
  const [nombre, setNombre] = useStateF('María G. Torres');
  const [municipio, setMunicipio] = useStateF('Quibdó, Chocó');
  const [programa, setPrograma] = useStateF('Jóvenes en Paz');
  const [gps, setGps] = useStateF('buscando'); // buscando | ok
  const [guardando, setGuardando] = useStateF(false);
  const timers = useRefF([]);
  useEffectF(() => () => timers.current.forEach(clearTimeout), []);

  useEffectF(() => {
    timers.current.push(setTimeout(() => setGps('ok'), 2100));
  }, []);

  const guardar = () => {
    if (guardando) return;
    setGuardando(true);
    timers.current.push(setTimeout(() => {
      onSaved({ nombre, mun: municipio.split(',')[0], cedula, programa });
    }, 1400));
  };

  return (
    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>

        <DIField label="Nombre completo" value={nombre} onChange={setNombre} conf="98.2%" />
        <DIField label="Municipio" value={municipio} onChange={setMunicipio} conf="97.5%" />
        <DIField label="Programa" value={programa} onChange={setPrograma} />

        {/* GPS */}
        <div style={{
          display: 'flex', alignItems: 'center', gap: 10, padding: '12px 15px', borderRadius: 10,
          border: `1px solid ${gps === 'ok' ? 'color-mix(in oklab, var(--di-acc) 40%, transparent)' : 'var(--di-border2)'}`,
          background: gps === 'ok' ? 'color-mix(in oklab, var(--di-acc) 7%, transparent)' : 'var(--di-panel)',
          fontFamily: DI_FONT_MONO, fontSize: 12, letterSpacing: '0.04em',
          color: gps === 'ok' ? 'var(--di-acc)' : 'var(--di-muted)', transition: 'all .4s',
        }}>
          <DIIcons.Pin />
          {gps === 'ok'
            ? <span>5.6943° N, 76.6612° O · capturado</span>
            : <span style={{ animation: 'di-blink 1.2s ease-in-out infinite' }}>Adquiriendo señal GPS…</span>}
        </div>
      </div>

      <div style={{ padding: '8px 26px 18px', flexShrink: 0 }}>
        <div style={{
          fontFamily: DI_FONT_MONO, fontSize: 11, letterSpacing: '0.1em', color: 'var(--di-muted)',
          textAlign: 'center', lineHeight: 1.7, marginBottom: 12,
        }}>Guardado local · AES-256<br />Se sincronizará al reconectar</div>
        <DIBtn onClick={guardar} disabled={guardando || gps !== 'ok'}>
          {guardando ? <span style={{ display: 'inline-flex', alignItems: 'center', gap: 9 }}><DIIcons.Sync spinning /> Guardando…</span>
            : gps !== 'ok' ? 'Esperando GPS…' : 'Guardar registro'}
        </DIBtn>
      </div>
    </div>
  );
}

// ── Confirmación ──────────────────────────────────────────────
function SuccessScreen({ record, online, onNueva, onPanel }) {

    <div style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0 }}>
      <div style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', padding: '0 30px' }}>
        <div style={{
          width: 96, height: 96, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center',
          background: 'color-mix(in oklab, var(--di-acc) 12%, transparent)',
          border: '1.5px solid var(--di-acc)', color: 'var(--di-acc)',

        }}>
          <DIIcons.Check size={42} />
        </div>
        <h2 style={{ fontFamily: DI_FONT_SANS, fontSize: 25, fontWeight: 600, color: 'var(--di-text)', margin: '28px 0 0', textAlign: 'center' }}>Registro guardado</h2>
        <p style={{ fontFamily: DI_FONT_SANS, fontSize: 15.5, color: 'var(--di-muted)', margin: '10px 0 0', textAlign: 'center', lineHeight: 1.5 }}>
          {online ? 'Sincronizado con el servidor central' : 'Almacenado en el dispositivo, en cola de sincronización'}

        {/* resumen */}
        <div style={{
          marginTop: 30, width: '100%', borderRadius: 13, border: '1px solid var(--di-border)',
          background: 'var(--di-panel)', padding: '16px 18px',
          display: 'flex', flexDirection: 'column', gap: 11,
        }}>
          {[
            ['ID', record.id],
            ['Beneficiario', record.nombre],
            ['Cédula', record.cedula],

                fontSize: 13.5, fontWeight: 600, textAlign: 'right',

}

Object.assign(window, { FormScreen, SuccessScreen });

</script>

<script type="text/babel" data-presets="react">
const { useState: useStateApp, useEffect: useEffectApp, useRef: useRefApp } = React;

const TWEAK_DEFAULTS = {
  "accent": "#2FBF8F",
  "online": false,
  "anim": true,
  "operador": "A. Mosquera"
};

const PASOS = [
  { id: 'auth',    n: '01', l: 'Autenticación' },
  { id: 'home',    n: '—',  l: 'Panel de campo' },
  { id: 'capture', n: '02', l: 'Captura OCR' },
  { id: 'form',    n: '03', l: 'Datos del beneficiario' },
  { id: 'success', n: '✓',  l: 'Confirmación' },
];

const RECORDS_INICIALES = [
  { id: 'REG-0118', nombre: 'Yeison Palacios M.', mun: 'Quibdó', hora: '08:32', estado: 'sincronizado', cedula: '1.077.421.880', programa: 'Jóvenes en Paz' },
  { id: 'REG-0119', nombre: 'Luz D. Córdoba',     mun: 'Atrato', hora: '09:05', estado: 'pendiente',    cedula: '1.077.318.224', programa: 'Jóvenes en Paz' },
  { id: 'REG-0120', nombre: 'Carlos Mena R.',     mun: 'Quibdó', hora: '09:27', estado: 'pendiente',    cedula: '1.098.554.103', programa: 'Renta Joven' },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [screen, setScreen] = useStateApp('auth');
  const [records, setRecords] = useStateApp(RECORDS_INICIALES);
  const [ultimo, setUltimo] = useStateApp(null);
  const [syncing, setSyncing] = useStateApp(false);
  const nextNum = useRefApp(121);
  const timers = useRefApp([]);
  useEffectApp(() => () => timers.current.forEach(clearTimeout), []);

  useEffectApp(() => {
    if (!t.online) { setSyncing(false); return; }
    const pendientes = records.filter((r) => r.estado === 'pendiente');
    if (pendientes.length === 0) return;
    setSyncing(true);
    setRecords((rs) => rs.map((r) => r.estado === 'pendiente' ? { ...r, estado: 'syncing' } : r));
    pendientes.forEach((p, i) => {
      timers.current.push(setTimeout(() => {
        setRecords((rs) => rs.map((r) => r.id === p.id ? { ...r, estado: 'sincronizado' } : r));
        if (i === pendientes.length - 1) setSyncing(false);
      }, 1100 + i * 900));
    });
  }, [t.online]);

  const guardarRegistro = (datos) => {
    const num = nextNum.current++;
    const min = 41 + (num - 121) * 7;
    const hora = `${9 + Math.floor(min / 60)}:${String(min % 60).padStart(2, '0')}`;
    const rec = {
      id: `REG-0${num}`, hora,
      estado: t.online ? 'sincronizado' : 'pendiente',
      ...datos,
    };
    setRecords((rs) => [...rs, rec]);
    setUltimo(rec);
    setScreen('success');
  };

  const irA = (id) => {
    if (id === 'success' && !ultimo) {
      setUltimo({ ...records[records.length - 1] });
    }
    setScreen(id);
  };

  const pasoActual = PASOS.findIndex((p) => p.id === screen);

  const [scale, setScale] = useStateApp(1);
  useEffectApp(() => {
    const medir = () => setScale(Math.min(1,
      (window.innerHeight - 24) / 856,
      (window.innerWidth - 48) / 770
    ));
    medir();
    window.addEventListener('resize', medir);
    return () => window.removeEventListener('resize', medir);
  }, []);

  return (
    <div style={{
      '--di-acc': t.accent,
      '--di-bg': '#0A100F',
      '--di-panel': '#101918',
      '--di-panel2': '#15201e',
      '--di-border': '#1a2624',
      '--di-border2': '#243431',
      '--di-text': '#E9F4F0',
      '--di-muted': '#7E938D',
      '--di-warn': '#D9A13B',
      height: '100%', display: 'flex', alignItems: 'center', justifyContent: 'center',
      boxSizing: 'border-box',
    }}>
     <div style={{
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      gap: 64, padding: '0 32px', boxSizing: 'border-box', flexShrink: 0,
      transform: `scale(${scale})`, transformOrigin: 'center center',
     }}>
      <nav style={{ display: 'flex', flexDirection: 'column', gap: 4, width: 240, flexShrink: 0 }}>
        <div style={{
          fontFamily: DI_FONT_MONO, fontSize: 11, letterSpacing: '0.34em', color: 'var(--di-acc)',
          textTransform: 'uppercase', marginBottom: 6,
        }}>Docintel</div>
        <div style={{
          fontFamily: DI_FONT_SANS, fontSize: 21, fontWeight: 600, color: 'var(--di-text)',
          lineHeight: 1.25, marginBottom: 22,
        }}>Registro de beneficiarios en campo, sin conexión</div>
        {PASOS.map((p, i) => {
          const activo = i === pasoActual;
          return (
            <button key={p.id} onClick={() => irA(p.id)} className="di-press" style={{
              display: 'flex', alignItems: 'center', gap: 13, padding: '11px 14px',
              borderRadius: 11, cursor: 'pointer', textAlign: 'left',
              background: activo ? 'var(--di-panel)' : 'transparent',
              border: `1px solid ${activo ? 'var(--di-border2)' : 'transparent'}`,
              transition: 'all .2s',
            }}>
              <span style={{
                fontFamily: DI_FONT_MONO, fontSize: 11, width: 24, flexShrink: 0,
                color: activo ? 'var(--di-acc)' : 'var(--di-muted)', letterSpacing: '0.05em',
              }}>{p.n}</span>
              <span style={{
                fontFamily: DI_FONT_SANS, fontSize: 14.5, fontWeight: activo ? 600 : 500,
                color: activo ? 'var(--di-text)' : 'var(--di-muted)',
              }}>{p.l}</span>
            </button>
          );
        })}
        <div style={{
          marginTop: 26, fontFamily: DI_FONT_MONO, fontSize: 10.5, letterSpacing: '0.12em',
          color: 'var(--di-muted)', opacity: 0.65, lineHeight: 1.8,
        }}>LIFEINCO · PROTOTIPO v2.1<br />FLUTTER · ML KIT · ALLOYDB</div>
      </nav>

      <DIFrame time="9:41" online={t.online}>
        <div key={screen} data-screen-label={PASOS[pasoActual] ? PASOS[pasoActual].l : screen}
          style={{ display: 'flex', flexDirection: 'column', flex: 1, minHeight: 0, animation: 'di-screen .32s ease-out' }}>
          {screen === 'auth' && <AuthScreen operador={t.operador} onDone={() => setScreen('home')} />}
          {screen === 'home' && <HomeScreen operador={t.operador} records={records} online={t.online} syncing={syncing} onNueva={() => setScreen('capture')} />}
          {screen === 'capture' && <CaptureScreen anim={t.anim} onBack={() => setScreen('home')} onDone={() => setScreen('form')} />}
          {screen === 'form' && <FormScreen onBack={() => setScreen('capture')} onSaved={guardarRegistro} />}
          {screen === 'success' && ultimo && <SuccessScreen record={ultimo} online={t.online} onNueva={() => setScreen('capture')} onPanel={() => setScreen('home')} />}
        </div>
      </DIFrame>
     </div>

      <TweaksPanel>
        <TweakSection label="Simulación" />
        <TweakToggle label="Conectividad (LTE)" value={t.online} onChange={(v) => setTweak('online', v)} />
        <TweakToggle label="Animaciones de escaneo" value={t.anim} onChange={(v) => setTweak('anim', v)} />
        <TweakSection label="Marca" />
        <TweakColor label="Color de acento" value={t.accent}
          options={['#2FBF8F', '#2FB2C9', '#9DBF2F', '#D9A13B']}
          onChange={(v) => setTweak('accent', v)} />
        <TweakText label="Operador" value={t.operador} onChange={(v) => setTweak('operador', v)} />
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
